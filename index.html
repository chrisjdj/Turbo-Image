<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="description" content="TurboImage: High-performance, browser-based image compression and conversion. Local processing for maximum privacy and speed. Support for JPEG, PNG, WebP, AVIF, and SVG." />
    <meta name="keywords" content="image compression, image converter, browser-based, high performance, privacy, webp, avif, svg, mozjpeg, oxipng" />
    <link rel="canonical" href="https://chrisjdj.github.io/Turbo-Image/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chrisjdj.github.io/Turbo-Image/" />
    <meta property="og:title" content="TurboImage - High-Speed Private Image Optimizer" />
    <meta property="og:description" content="Compress and convert images locally in your browser with turbo speed. No uploads, total privacy." />
    <meta property="og:image" content="https://chrisjdj.github.io/Turbo-Image/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://chrisjdj.github.io/Turbo-Image/" />
    <meta property="twitter:title" content="TurboImage - High-Speed Private Image Optimizer" />
    <meta property="twitter:description" content="Compress and convert images locally in your browser with turbo speed. No uploads, total privacy." />
    <meta property="twitter:image" content="https://chrisjdj.github.io/Turbo-Image/og-image.png" />

    <title>TurboImage - High-Performance Browser Image Optimizer</title>
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "TurboImage",
      "operatingSystem": "All",
      "applicationCategory": "MultimediaApplication",
      "description": "High-performance, browser-based image compression and conversion. Local processing for maximum privacy and speed.",
      "url": "https://chrisjdj.github.io/Turbo-Image/",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
    </script>
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
